<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빈칸 차트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0b0f17;--bg2:#111827;--panel:#151c28;--panel2:#1d2635;--line:#273244;--ink:#eef2f7;--muted:#8a96a8;
  --up:#ff5a5f;--down:#4d8dff;--accent:#ffd34d;--accent-ink:#231a00;--good:#2fd07f;--bad:#ff8a3d;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f5f9;--bg2:#e9edf4;--panel:#ffffff;--panel2:#f1f4f8;--line:#e1e6ee;--ink:#151a22;--muted:#677386;
  --up:#e5383b;--down:#1f6feb;--good:#11995a;--bad:#e8590c;--shadow:0 8px 24px rgba(20,30,50,.08);
}}
:root{color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f5f9;--bg2:#e9edf4;--panel:#ffffff;--panel2:#f1f4f8;--line:#e1e6ee;--ink:#151a22;--muted:#677386;
  --up:#e5383b;--down:#1f6feb;--good:#11995a;--bad:#e8590c;--shadow:0 8px 24px rgba(20,30,50,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 500px at 50% -200px,var(--bg2),var(--bg));color:var(--ink);
  font-family:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.up{color:var(--up)}.dn{color:var(--down)}

/* 홈 */
.hero{padding:28px 4px 18px}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:28px;font-weight:900;letter-spacing:-.5px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:18px}
.seg{display:grid;gap:6px;background:var(--panel2);padding:5px;border-radius:14px}
.seg button{padding:11px 6px;border-radius:10px;font-weight:700;color:var(--muted);transition:.15s}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.label{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--muted)}
.cta{width:100%;padding:17px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:800;
  box-shadow:0 8px 20px rgba(255,211,77,.25);transition:transform .1s}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.35;box-shadow:none}
.ghost{width:100%;padding:15px;border-radius:16px;background:var(--panel2);font-weight:700;margin-top:10px}

/* 플레이 */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:10px 0 12px;margin:-16px 0 0}
.dots{display:flex;gap:5px;margin-top:10px}.dots i{flex:1;height:5px;border-radius:9px;background:var(--panel2)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--accent)}
.timer{height:3px;border-radius:9px;background:var(--panel2);margin-top:8px;overflow:hidden}.timer i{display:block;height:100%;background:var(--muted);transition:width .1s linear}
.timer i.hurry{background:var(--bad)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.tags span{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--panel2);color:var(--muted);font-weight:600}
.main{padding:8px 6px 4px;overflow:hidden}
.q{font-size:17px;font-weight:800;margin:18px 2px 10px}.fitq{font-size:15px;margin:10px 2px 8px}
.fit .tags{margin:0 0 6px}.fit .top{padding-bottom:6px}.fit .bottom{padding-top:8px}.fit .grid{gap:8px}.fit .opt{padding:6px 4px 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;padding:8px 6px 6px;border-radius:18px;background:var(--panel);border:2px solid var(--line);transition:transform .12s,border-color .12s;text-align:left}
.opt:active{transform:scale(.98)}
.opt .n{position:absolute;left:10px;top:9px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);font-weight:800;font-size:13px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,211,77,.18)}.opt.sel .n{background:var(--accent);color:var(--accent-ink)}
.opt.real{border-color:var(--good)}.opt.real .n{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad)}.opt.wrong .n{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.badge{position:absolute;right:10px;top:9px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;color:#fff}
.src{font-size:11px;color:var(--muted);padding:2px 6px 2px;line-height:1.3}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{padding:22px 0;border-radius:20px;font-size:44px;font-weight:900;background:var(--panel);border:2px solid var(--line);transition:transform .1s}
.ox button:active{transform:scale(.97)}
.verdict{margin-top:12px;padding:16px;animation:pop .25s ease-out both}
.verdict h2{margin:0;font-size:24px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--panel2);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:17px;margin-top:2px}
.bottom{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(transparent,var(--bg) 35%);margin-top:6px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes shake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.shake{animation:shake .3s}
svg{display:block;width:100%;height:auto}

/* 공부 */
.study-entry{display:flex;align-items:center;gap:12px;width:100%;padding:16px;margin-top:12px}
.study-entry .ic{width:42px;height:42px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:9px 14px;border-radius:999px;background:var(--panel2);color:var(--muted);font-weight:700;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.lesson{padding:16px;margin-bottom:12px}.lesson h3{margin:0 0 4px;font-size:17px}.lesson p{margin:6px 0 0;line-height:1.6;font-size:14.5px;color:var(--muted)}
.lesson .fig{background:var(--panel2);border-radius:14px;padding:8px;margin-top:12px}
.lesson .tip{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,211,77,.1);font-size:13.5px;line-height:1.55}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.figs>div{background:var(--panel2);border-radius:14px;padding:8px 8px 10px;text-align:center;font-size:13px}
.figs b{display:block;margin-top:4px;font-size:14px}
.pat{display:grid;gap:8px;margin-top:10px}.pat>div{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55}.pat b{display:block;margin-bottom:3px;font-size:13px}
.stat-big{font-size:30px;font-weight:900;letter-spacing:-1px}
/* 대전 */
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.inp:focus{outline:2px solid var(--accent);border-color:transparent}
.code{font-size:44px;font-weight:900;letter-spacing:8px;margin-top:4px}
.pl{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}.pl:first-child{border-top:0}.pl.mine{background:var(--panel2)}
.av{width:32px;height:32px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-weight:800}
.bstrip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.bstrip::-webkit-scrollbar{display:none}
.bp{flex:1 0 110px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;display:grid;grid-template-columns:1fr auto;gap:2px 6px}
.bp.me{border-color:var(--accent)}.bp b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bp .mini-dots{grid-column:1/-1}
.mini-dots{display:flex;gap:2px;margin-top:3px}.mini-dots i{flex:1;height:3px;border-radius:3px;background:var(--panel2);min-width:6px}.mini-dots i.ok{background:var(--good)}.mini-dots i.no{background:var(--bad)}
/* 결과 */
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.nextbar>div{max-width:688px;margin:0 auto}
.explain{margin-top:12px;padding:16px}
.ex-item{border-top:1px solid var(--line);padding:14px 0 12px}.ex-item:first-of-type{border-top:0;padding-top:10px}
.ex-row{display:grid;grid-template-columns:104px 1fr;gap:8px;margin-top:8px;font-size:14px;line-height:1.55}.ex-row b{font-size:12.5px;color:var(--muted);padding-top:2px}
.tg{flex:none;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px}
.pn{font-weight:800;font-size:16px;color:var(--ink);border-bottom:2px dotted var(--accent);padding:0 1px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:fi .15s}
.sheet{width:100%;max-width:560px;max-height:80vh;overflow:auto;padding:18px;animation:pop .2s ease-out}
@media(min-width:640px){.modal{align-items:center}}
.accbar{position:relative;height:10px;border-radius:9px;background:var(--panel2);margin-top:10px}
.accbar i{display:block;height:100%;border-radius:9px}.accbar span{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);opacity:.6}
.score{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1}
.list div.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>const Q=__DATA__;</script>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const L={easy:"쉬움",normal:"보통",hard:"어려움",KOSPI:"코스피",KOSDAQ:"코스닥",large:"대형주",mid:"중형주",small:"소형주",micro:"초소형주",day:"일봉",week:"주봉"};
const SRC={mirror:"실제 모양을 뒤집은 것",other_stock:"다른 종목의 구간",other_stock_volatility_mismatch:"변동성이 다른 종목",same_market_cap_tier:"비슷한 규모 종목의 구간",same_stock_other_period:"같은 종목의 다른 시기",same_sector:"같은 업종 종목의 구간"};
const LIM={choice4:{easy:30,normal:25,hard:25},ox:{easy:15,normal:12,hard:12},draw:{easy:45,normal:40,hard:40}}, MUL={easy:1,normal:1.5,hard:2.5};
// 그리기 모드: 이 일치도(%) 미만이면 0점. 직선으로만 이어도 66~72%, 대충 맞게 그리면 88~94%
const DRAW_PASS={easy:40,normal:45,hard:50}, DRAW_MAX=300;
const ZOOM={main:14,thumb:3}; // 빈칸 양옆으로 보여 줄 봉 수 (확대)
let cfg=Object.assign({type:"choice4",diff:"easy",iv:"day"},JSON.parse(localStorage.getItem("cg_cfg")||"{}")), S=null, timer=null;
const seen=new Set(JSON.parse(localStorage.getItem("cg_seen")||"[]"));
let rnd=Math.random;
const mulberry=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const save=()=>{try{localStorage.setItem("cg_cfg",JSON.stringify(cfg));localStorage.setItem("cg_seen",JSON.stringify([...seen]))}catch(e){}};
const key=q=>q.r.code+q.r.gap_start;

/* 차트: 빈칸 주변만 확대해서 그린다 */
function chart(p,fill,o={}){
  const {L:l,G:g,R:r}=p.layout,N=l+g+r,c=p.candles,thumb=!!o.thumb,side=thumb?ZOOM.thumb:ZOOM.main;
  const i0=Math.max(l-side,0),i1=Math.min(l+g+side,N);
  const W=thumb?220:720,H=thumb?(o.th||150):(o.mh||(innerWidth<560?560:400)),pr=thumb?4:(innerWidth<560?78:50),vol=!thumb&&p.volume;
  const top=thumb?8:14,pb=vol?H*.78:H-8;
  const vis=[];for(let i=i0;i<i1;i++){if(i<l)vis.push([i,c[i]]);else if(i>=l+g)vis.push([i,c[i-g]])}
  let lo=1e9,hi=-1e9;for(const grp of [vis.map(v=>v[1]),fill,o.ghost,...(o.range||[])])if(grp)for(const k of grp){lo=Math.min(lo,k[2]);hi=Math.max(hi,k[1])}
  const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const st=(W-pr-4)/(i1-i0),cx=i=>4+st*(i-i0+.5),y=v=>pb-(v-lo)/(hi-lo)*(pb-top),bw=Math.max(st*.62,1.5);
  const gx0=cx(l)-st/2,gx1=cx(l+g-1)+st/2;
  if(o.geo)GEO={gx0,gx1,st,lo,hi,pb,top,G:g,W,H,end:p.options[0][g-1][3]};
  const cd=(k,x,op=1,extra="")=>{const u=k[3]>=k[0],col=u?"var(--up)":"var(--down)",t=y(Math.max(k[0],k[3])),h=Math.max(y(Math.min(k[0],k[3]))-t,1.2);
    return `<g opacity="${op}"${extra}><line x1="${x}" x2="${x}" y1="${y(k[1])}" y2="${y(k[2])}" stroke="${col}" stroke-width="${thumb?1.4:1.8}" stroke-linecap="round"/><rect x="${x-bw/2}" y="${t}" width="${bw}" height="${h}" rx="${bw>6?1.5:0}" fill="${col}"/></g>`};
  let s=`<svg viewBox="0 0 ${W} ${H}" font-family="Pretendard Variable,Pretendard,sans-serif" role="img" aria-label="${thumb?"보기 차트":"가운데가 가려진 차트"}">
  <defs><pattern id="h${o.id||0}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="var(--panel2)"/><line x1="0" y1="0" x2="0" y2="10" stroke="var(--line)" stroke-width="4"/></pattern></defs>`;
  if(!thumb){const span=(hi-lo)*100,step=[1,2,5,10,20,25,50,100].find(v=>span/v<=5)||200;
    for(let pc=Math.ceil((lo-1)*100/step)*step;pc<=(hi-1)*100;pc+=step){const v=1+pc/100;
      s+=`<line x1="0" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${pc==0?'stroke-dasharray="5 5"':'opacity=".55"'}/><text x="${W-pr+6}" y="${y(v)+4}" font-size="${innerWidth<560?20:12}" font-weight="600" fill="var(--muted)">${pc>0?"+":""}${pc}%</text>`}}
  if(fill){const col=o.style=="real"?"var(--good)":"var(--accent)";s+=`<rect x="${gx0}" y="0" width="${gx1-gx0}" height="${H}" fill="${col}" opacity="${thumb?0.06:0.09}" rx="8"/>`}
  else if(o.draw)s+=`<rect x="${gx0}" y="2" width="${gx1-gx0}" height="${H-4}" fill="var(--accent)" opacity=".07" rx="10"/>`;
  else s+=`<rect x="${gx0}" y="2" width="${gx1-gx0}" height="${H-4}" fill="url(#h${o.id||0})" rx="10"/><circle cx="${(gx0+gx1)/2}" cy="${pb/2+top/2}" r="${thumb?14:28}" fill="var(--panel)"/><text x="${(gx0+gx1)/2}" y="${pb/2+top/2+(thumb?6:12)}" text-anchor="middle" font-size="${thumb?17:34}" font-weight="900" fill="var(--muted)">?</text>`;
  if(!thumb)s+=`<line x1="${gx0}" x2="${gx0}" y1="0" y2="${H}" stroke="var(--muted)" stroke-dasharray="3 4" opacity=".5"/><line x1="${gx1}" x2="${gx1}" y1="0" y2="${H}" stroke="var(--muted)" stroke-dasharray="3 4" opacity=".5"/>`;
  for(const [i,k] of vis)s+=cd(k,cx(i),thumb?.35:1);
  if(o.ghost)o.ghost.forEach((k,j)=>s+=cd(k,cx(l+j),.25));
  if(fill)fill.forEach((k,j)=>s+=cd(k,cx(l+j),1,o.style=="real"?` style="animation:fi .22s ${(j/g*.6).toFixed(2)}s both"`:""));
  if(vol){const fv=fill?o.fillVol:null,vals=[...vis.map(([i])=>p.volume[i<l?i:i-g]),...(fv||[])],vm=Math.max(...vals)||1,vy=v=>H-2-v/vm*(H-2-H*.82);
    for(const [i,k] of vis){const v=p.volume[i<l?i:i-g];s+=`<rect x="${cx(i)-bw/2}" y="${vy(v)}" width="${bw}" height="${H-2-vy(v)}" rx="1" fill="${k[3]>=k[0]?"var(--up)":"var(--down)"}" opacity=".35"/>`}
    if(fv)fv.forEach((v,j)=>{const k=fill[j];s+=`<rect x="${cx(l+j)-bw/2}" y="${vy(v)}" width="${bw}" height="${H-2-vy(v)}" rx="1" fill="${k[3]>=k[0]?"var(--up)":"var(--down)"}" opacity=".35"/>`})}
  if(o.draw){const yv=v=>pb-(v-lo)/(hi-lo)*(pb-top),xt=tt=>gx0+st*(tt+.5),endV=p.options[0][g-1][3];
    const pts=drawnPoints(o.drawn||[],g,endV);
    s+=`<path id="${o.style?"dl2":"dl"}" d="${o.drawn&&o.drawn.length?pts.map(([tt,v],i)=>(i?"L":"M")+xt(tt).toFixed(1)+","+yv(v).toFixed(1)).join(""):""}" fill="none" stroke="var(--accent)" stroke-width="${o.style?3:4}" stroke-linecap="round" stroke-linejoin="round" ${o.style?'opacity=".9" stroke-dasharray="7 5"':''}/>`;
    s+=`<circle cx="${xt(-1)}" cy="${yv(1)}" r="7" fill="var(--accent)" stroke="var(--panel)" stroke-width="3"/><circle cx="${xt(g-1)}" cy="${yv(endV)}" r="7" fill="var(--accent)" stroke="var(--panel)" stroke-width="3"/>`;
    if(!o.style&&!(o.drawn&&o.drawn.length))s+=`<text id="dh" x="${(gx0+gx1)/2}" y="${top+30}" text-anchor="middle" font-size="${innerWidth<560?26:16}" font-weight="800" fill="var(--accent)">✍️ 점에서 점까지 그려 보세요</text>`;}
  return s+"</svg>";
}
let GEO=null;
/* 그린 점(t: 빈칸 안 캔들 위치, v: 가격 비율)을 양 끝 고정점과 함께 정렬해서 돌려준다 */
function drawnPoints(raw,g,endV){
  const pts=raw.filter(([tt])=>tt>-1&&tt<g-1).sort((a,b)=>a[0]-b[0]);
  return [[-1,1],...pts,[g-1,endV]];
}
/* 일치도: 캔들마다 그린 선의 값과 실제 종가의 차이를 평균 내서, 빈칸 안 움직임 폭으로 나눈다 */
function drawScore(raw,real){
  const g=real.length,pts=drawnPoints(raw,g,real[g-1][3]);
  const at=tt=>{for(let i=1;i<pts.length;i++)if(pts[i][0]>=tt){const [a,va]=pts[i-1],[b,vb]=pts[i];return b==a?vb:va+(vb-va)*(tt-a)/(b-a)}return pts[pts.length-1][1]};
  const closes=real.map(k=>k[3]),all=[1,...closes],scale=Math.max(Math.max(...all)-Math.min(...all),.03);
  let err=0;for(let j=0;j<g-1;j++)err+=Math.abs(at(j)-closes[j]);err/=Math.max(g-1,1);
  return Math.round(100*Math.max(0,1-err/scale));
}
function drawCoverage(raw,g){if(raw.length<2)return 0;const ts=raw.map(r=>r[0]);return (Math.min(Math.max(...ts),g-1)-Math.max(Math.min(...ts),-1))/g}

    const tt=(m.x-GEO.gx0)/GEO.st-.5,v=GEO.lo+(GEO.pb-m.y)/(GEO.pb-GEO.top)*(GEO.hi-GEO.lo);return [Math.max(-1,Math.min(GEO.G-1,tt)),v]};

    const p0=toPt(e);S.drawn=S.drawn.filter(([tt])=>tt<p0[0]-.3);S.drawn.push(p0);redrawLine()});

    if(p1[0]<last[0])S.drawn=S.drawn.filter(([tt])=>tt<p1[0]);S.drawn.push(p1);redrawLine()});

function mini(cs,{w=280,h=120,mark=null,lines=[],label=null}={}){
  let lo=1e9,hi=-1e9;cs.forEach(k=>{lo=Math.min(lo,k[2]);hi=Math.max(hi,k[1])});lines.forEach(l=>{lo=Math.min(lo,l.v);hi=Math.max(hi,l.v)});
  const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;const n=cs.length,st=w/n,bw=Math.min(st*.6,26),y=v=>h-6-(v-lo)/(hi-lo)*(h-12);
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  if(mark)s+=`<rect x="${mark[0]*st}" y="0" width="${(mark[1]-mark[0])*st}" height="${h}" rx="8" fill="var(--accent)" opacity=".13"/>`;
  lines.forEach(l=>s+=`<line x1="0" x2="${w}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.c||"var(--muted)"}" stroke-dasharray="5 4" stroke-width="1.5"/>${l.t?`<text x="${w-4}" y="${y(l.v)-5}" text-anchor="end" font-size="11" font-weight="700" fill="${l.c||"var(--muted)"}">${l.t}</text>`:""}`);
  cs.forEach((k,i)=>{const x=st*(i+.5),u=k[3]>=k[0],col=u?"var(--up)":"var(--down)",t=y(Math.max(k[0],k[3])),hh=Math.max(y(Math.min(k[0],k[3]))-t,2);
    s+=`<line x1="${x}" x2="${x}" y1="${y(k[1])}" y2="${y(k[2])}" stroke="${col}" stroke-width="2" stroke-linecap="round"/><rect x="${x-bw/2}" y="${t}" width="${bw}" height="${hh}" rx="2" fill="${col}"/>`});
  return s+"</svg>";
}
// 종가 흐름으로 캔들 만들기 (그림용)
function path(closes){ // 종가 흐름 → 그림용 캔들. 구간마다 2개로 나누고, 움직임이 작아도 몸통이 보이게 한다
  const span=Math.max(...closes)-Math.min(...closes)||1,pts=[closes[0]];
  for(let i=1;i<closes.length;i++){const a=closes[i-1],b=closes[i];pts.push(a+(b-a)*.55+(i%2?.06:-.06)*span,b)}
  const out=[];for(let i=1;i<pts.length;i++){let o=pts[i-1],c=pts[i];if(Math.abs(c-o)<.035*span)c=o+(i%2?.035:-.035)*span;
    const w=.05*span;out.push([o,Math.max(o,c)+w*(.4+((i*7)%5)/6),Math.min(o,c)-w*(.4+((i*3)%5)/6),c])}
  return out}

  {h:"이 탭 보는 법",p:"차트 분석에서 자주 쓰는 모양을 <b>① 어떤 모양인지 → ② 그 뒤 흔히 어떻게 된다고 알려져 있는지 → ③ 빈칸 문제에서는 어떻게 추측하면 되는지</b> 순서로 정리했어요.",tip:"②는 기술적 분석에서 흔히 하는 해석이에요. 우리가 직접 잰 데이터로는 '추세가 그대로 이어질 확률'이 49%로 동전 던지기 수준이었어요. 그래서 빈칸 문제에서는 모양보다 <b>양 끝 높이와 캔들 크기</b>를 먼저 보는 게 더 확실해요."},
  {h:"상승 깃발",p:"급하게 오른 뒤 살짝 아래로 기울어진 좁은 박스에서 쉬어 가요.",fig:()=>`<div class="fig">${mini(path([10, 13, 16, 19, 18.3, 18.8, 18, 18.5, 17.8, 20, 22]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>쉬는 구간이 끝나면 원래 방향(위)으로 다시 오르는 경우가 많다고 알려져 있어요.</div><div><b>🎯 빈칸에서는</b>빈칸 왼쪽이 급등, 오른쪽이 더 높은 곳에서 시작하면 → 빈칸은 '좁게 옆으로 쉬다가 끝에서 오르는' 모양을 고르세요.</div></div>`},
  {h:"하락 깃발",p:"급락한 뒤 살짝 위로 기울어진 좁은 박스에서 반등하는 듯 쉬어 가요.",fig:()=>`<div class="fig">${mini(path([22, 19, 16, 13, 13.7, 13.2, 14, 13.5, 14.2, 12, 10]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>쉬는 구간이 끝나면 다시 아래로 이어지는 경우가 많아요.</div><div><b>🎯 빈칸에서는</b>왼쪽 급락, 오른쪽이 더 낮은 곳에서 시작 → '작게 반등하다가 끝에서 떨어지는' 모양.</div></div>`},
  {h:"쌍바닥 (W자)",p:"비슷한 바닥을 두 번 찍고 그 사이 고점(목선)을 넘어요.",fig:()=>`<div class="fig">${mini(path([20, 16, 12, 15, 17, 15, 12.2, 15, 18, 21]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>두 번째 바닥에서 지지가 확인되면 목선 돌파 후 상승으로 바뀌는 신호로 봐요.</div><div><b>🎯 빈칸에서는</b>왼쪽에 바닥 하나, 오른쪽이 높게 끝나면 → 빈칸에 '두 번째 바닥'이 숨어 있을 가능성. 한 번 내려갔다 올라오는 보기를 고르세요.</div></div>`},
  {h:"쌍봉 (M자)",p:"비슷한 고점을 두 번 찍고 그 사이 저점을 깨요.",fig:()=>`<div class="fig">${mini(path([10, 14, 18, 15, 13, 15, 17.8, 15, 12, 9]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>두 번째 고점에서 막히면 하락으로 바뀌는 신호로 봐요.</div><div><b>🎯 빈칸에서는</b>왼쪽에 고점 하나, 오른쪽이 낮게 끝나면 → 빈칸은 '한 번 더 올라갔다가 꺾이는' 모양.</div></div>`},
  {h:"머리어깨형",p:"왼쪽 어깨 - 더 높은 머리 - 낮은 오른쪽 어깨, 세 개의 봉우리.",fig:()=>`<div class="fig">${mini(path([10, 14, 12, 18, 12.5, 14.5, 11.5, 9]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>오른쪽 어깨 뒤 목선을 깨면 하락 추세로 바뀌는 대표 모양이에요.</div><div><b>🎯 빈칸에서는</b>빈칸 앞이 '높은 머리'였다면 → 빈칸은 머리보다 낮은 작은 반등(오른쪽 어깨) 후 하락.</div></div>`},
  {h:"역머리어깨형",p:"머리어깨형을 뒤집은 모양. 가장 깊은 바닥이 가운데에 있어요.",fig:()=>`<div class="fig">${mini(path([18, 14, 16, 10, 15.5, 13.5, 16.5, 19]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>목선을 넘으면 상승 추세로 바뀌는 신호로 봐요.</div><div><b>🎯 빈칸에서는</b>가장 깊은 바닥 뒤에 빈칸 → 덜 깊은 바닥(오른쪽 어깨)을 찍고 올라가는 보기.</div></div>`},
  {h:"상승 삼각형",p:"고점은 같은 높이(저항)인데 저점이 점점 높아져요.",fig:()=>`<div class="fig">${mini(path([10, 15, 12, 15, 13, 15, 14, 15, 14.6, 18]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>저항선을 위로 뚫는 경우가 많다고 알려져 있어요.</div><div><b>🎯 빈칸에서는</b>폭이 점점 좁아지다 빈칸 → 빈칸 끝 무렵 위로 튀어 나가는 모양.</div></div>`},
  {h:"하락 삼각형",p:"저점은 같은 높이(지지)인데 고점이 점점 낮아져요.",fig:()=>`<div class="fig">${mini(path([18, 13, 16, 13, 15, 13, 14, 13, 13.4, 10]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>지지선을 아래로 깨는 경우가 많아요.</div><div><b>🎯 빈칸에서는</b>저점이 계속 같은 곳에서 받쳐지다 빈칸 → 끝에서 아래로 깨지는 모양.</div></div>`},
  {h:"대칭 삼각형 (수렴)",p:"고점은 낮아지고 저점은 높아지며 폭이 좁아져요.",fig:()=>`<div class="fig">${mini(path([14, 19, 10, 17.5, 11.5, 16, 12.8, 15, 13.6, 14.3]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>에너지가 모이는 구간이라 방향은 몰라도 곧 크게 움직이는 경향이 있어요.</div><div><b>🎯 빈칸에서는</b>양옆 캔들이 점점 작아지면 → 빈칸도 작고 얌전한 보기. 오른쪽이 갑자기 크게 움직이면 빈칸 끝에서 터진 것.</div></div>`},
  {h:"박스권 돌파",p:"일정 범위에서 오르내리다 위(또는 아래)로 벗어나요.",fig:()=>`<div class="fig">${mini(path([12, 15, 12.3, 15, 12.2, 14.8, 12.5, 15, 17.5, 19]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>돌파 뒤에는 그 방향으로 한동안 이어지거나, 박스 끝까지 되돌아와 확인하는 경우가 많아요.</div><div><b>🎯 빈칸에서는</b>왼쪽이 박스, 오른쪽이 박스 위에서 시작하면 → 빈칸 안에서 돌파가 일어난 거예요. 박스를 유지하다 뚫는 보기를 고르세요.</div></div>`},
  {h:"컵 앤 핸들",p:"둥근 바닥(컵) 뒤에 작은 눌림(손잡이)이 와요.",fig:()=>`<div class="fig">${mini(path([18, 15, 13, 12, 13, 15, 18, 17, 16.5, 17.2, 20]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>손잡이 뒤 이전 고점을 넘으면 상승이 이어진다고 봐요.</div><div><b>🎯 빈칸에서는</b>둥근 바닥이 끝난 뒤 빈칸 → 살짝 눌렸다가 다시 오르는 모양.</div></div>`},
  {h:"V자 반등",p:"급하게 떨어진 만큼 급하게 회복해요.",fig:()=>`<div class="fig">${mini(path([20, 17, 14, 11, 9, 12, 15, 18, 20]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>극단적인 공포 뒤에 자주 나와요. 회복 속도가 하락 속도와 비슷한 경우가 많아요.</div><div><b>🎯 빈칸에서는</b>왼쪽 급락, 오른쪽이 원래 높이 근처 → 빈칸 안에 '바닥 찍고 급반등'이 있어요. 양 끝이 비슷한 높이여도 직선 보기를 고르지 마세요.</div></div>`},
  {h:"급등 후 되돌림",p:"하루 이틀 크게 오른 뒤 일부를 반납해요.",fig:()=>`<div class="fig">${mini(path([10, 11, 16, 20, 18.5, 17, 17.8, 16.8, 17.3]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>실제 데이터에서도 크게 오른 날 다음 5일은 평균 -0.4%, 더 오른 경우는 42%였어요.</div><div><b>🎯 빈칸에서는</b>빈칸 앞에 장대양봉이 있으면 → 빈칸은 '조금 내려오며 옆으로 기는' 모양일 가능성이 커요.</div></div>`},
  {h:"하락 쐐기",p:"고점과 저점이 모두 낮아지지만 폭은 좁아지며 하락 힘이 약해져요.",fig:()=>`<div class="fig">${mini(path([20, 17, 18.5, 15.5, 16.8, 14.5, 15.6, 14, 15, 17]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>끝에서 위로 반전되는 경우가 많다고 알려져 있어요.</div><div><b>🎯 빈칸에서는</b>내려가는 폭이 줄어드는 중 빈칸 → 끝에서 위로 꺾이는 모양.</div></div>`},
  {h:"상승 쐐기",p:"고점과 저점이 모두 높아지지만 폭이 좁아지며 상승 힘이 약해져요.",fig:()=>`<div class="fig">${mini(path([10, 13, 11.5, 14.5, 13.2, 15.5, 14.4, 16, 15, 12.5]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>끝에서 아래로 반전되는 경우가 많아요.</div><div><b>🎯 빈칸에서는</b>오르는 폭이 줄어드는 중 빈칸 → 끝에서 아래로 꺾이는 모양.</div></div>`},
  {h:"둥근 바닥",p:"천천히 내려와 천천히 올라가는 그릇 모양이에요.",fig:()=>`<div class="fig">${mini(path([20, 17, 15, 13.8, 13.2, 13, 13.3, 14, 15.5, 17.5]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>바닥 근처에서 오래 머문 뒤 서서히 상승으로 바뀌어요.</div><div><b>🎯 빈칸에서는</b>빈칸이 바닥 근처라면 → 크게 출렁이지 않고 완만하게 휘는 보기를 고르세요.</div></div>`},
  {h:"계단식 상승",p:"오르고 쉬고, 오르고 쉬기를 반복해요.",fig:()=>`<div class="fig">${mini(path([10, 13, 13.2, 12.8, 13.1, 16, 16.2, 15.8, 16.1, 19]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>같은 리듬이 몇 번 이어지는 경향이 있어요.</div><div><b>🎯 빈칸에서는</b>양옆에 계단 리듬이 보이면 → 빈칸도 '한 번 오르고 쉬는' 계단 한 칸.</div></div>`},
  {h:"거래량 급증 + 장대봉",p:"평소 몇 배의 거래량과 함께 큰 캔들이 나와요.",fig:()=>`<div class="fig">${mini(path([12, 12.2, 12.1, 15, 15.6, 14.4, 16, 14.8, 15.5]),{h:110})}</div><div class="pat"><div><b>📈 이후 경향</b>실제 데이터에서 거래량이 터진 뒤 가격 움직임은 평소보다 약 15% 컸어요. 이후 며칠 출렁임이 커져요.</div><div><b>🎯 빈칸에서는</b>빈칸 바로 앞에 거래량 폭증이 있으면 → 빈칸은 캔들이 크고 위아래로 흔들리는 보기.</div></div>`}]},

  {h:"캔들 조합을 빈칸에서 쓰는 법",p:"빈칸 바로 앞 2~3개 캔들이 위 조합 중 하나라면, 빈칸 첫 부분의 방향 힌트로 쓰세요. 예: 하락 끝에 망치형·샛별형 → 빈칸은 반등으로 시작하는 보기. 상승 끝에 석별형·교수형·하락 장악형 → 빈칸은 꺾이며 시작하는 보기.",tip:"캔들 조합은 신호가 약해서, 빈칸 오른쪽 끝 높이와 어긋나면 끝 높이를 믿으세요."}]},

   fig:()=>`<div class="fig" style="text-align:center;padding:16px"><div class="stat-big">49%</div><div class="xs muted">직전 20일과 다음 10일의 방향이 같았던 비율</div></div>`,
   tip:"빈칸 문제에서 '앞에서 올랐으니 빈칸도 계속 올랐겠지'는 좋은 단서가 아니에요. 대신 빈칸 <b>양 끝의 높이</b>(모든 보기가 같은 곳에서 출발하고 같은 곳에서 끝나요)와 아래 경향성을 보세요."},
  {h:"변동성은 이어져요 (가장 쓸모 있는 단서)",p:"잠잠하던 종목은 계속 잠잠하고, 요동치던 종목은 계속 요동치는 경향이 뚜렷해요. 직전 20일 움직임이 작은 종목은 다음 10일 움직임이 보통의 <b>0.6배</b>, 큰 종목은 <b>1.6배</b>였어요.",
   fig:()=>`<div class="figs"><div style="padding:14px 8px"><div class="stat-big dn">0.6×</div>잠잠했던 종목의<br>다음 움직임</div><div style="padding:14px 8px"><div class="stat-big up">1.6×</div>요동쳤던 종목의<br>다음 움직임</div></div>`,
   tip:"양옆 캔들이 짧고 얌전한데 보기 하나만 크게 출렁인다면 오답일 가능성이 높아요. 반대로 양옆이 거칠면 빈칸도 거칠었을 거예요."},
  {h:"하루 급등 뒤엔 살짝 되돌리는 편",p:"평소보다 3배 넘게 크게 오른 날 다음 5일은 평균 <b>-0.4%</b>였고, 더 오른 경우는 <b>42%</b>에 그쳤어요. 크게 내린 날 뒤에는 뚜렷한 방향이 없었어요.",
   fig:()=>`<div class="fig">${mini(path([10,10.4,10.2,14.5,13.8,13.2,13.6,13]),{mark:[2.5,3.5]})}</div>`},
  {h:"거래량이 터지면 변동성도 커져요",p:"평소보다 거래량이 크게 늘어난 날 이후에는 가격 움직임도 평소보다 <b>약 15%</b> 컸어요. 거래량 막대가 높이 솟은 곳 근처는 캔들도 길어지기 쉬워요.",
   tip:"쉬움·보통 난이도에서는 거래량이 보여요. 빈칸 바로 옆 거래량이 크면 빈칸 안도 크게 움직였을 가능성을 생각해 보세요."},
  {h:"빈칸 문제 푸는 순서",p:"① 빈칸 양 끝의 높이 차이를 본다 → ② 양옆 캔들의 크기(변동성)를 본다 → ③ 보기 중 캔들 크기가 양옆과 어울리지 않는 것을 지운다 → ④ 오른쪽 첫 캔들의 갭이나 거래량으로 빈칸 끝부분의 움직임을 짐작한다.",
   tip:"이 수치들은 과거 데이터에서 나온 경향일 뿐 미래를 보장하지 않아요. 투자 판단의 근거로 쓰지 마세요."}]}
};
let studyTab="candle";
function study(tab){
  if(tab)studyTab=tab;S=null;clearInterval(timer);app.classList.remove('fit');
  const L2=LESSONS[studyTab];
  app.innerHTML=`<div class="row" style="margin:6px 0 4px"><button class="muted" style="font-size:22px;padding:4px 6px 4px 0" onclick="home()" aria-label="뒤로">←</button><b style="font-size:20px">차트 공부하기</b></div>
  <div class="tabs">${Object.entries(LESSONS).map(([k,v])=>`<button class="${k==studyTab?"on":""}" onclick="study('${k}')">${v.t}</button>`).join("")}</div>
  ${L2.items.map(it=>`<div class="card lesson"><h3>${it.h}</h3><p>${it.p}</p>${it.fig?it.fig():""}${it.tip?`<div class="tip">💡 ${it.tip}</div>`:""}</div>`).join("")}
  <button class="cta" style="margin-top:4px" onclick="home()">문제 풀러 가기</button>`;
  window.scrollTo(0,0);
}
function copyRes(m,n){const t=`빈칸 차트 ${L[cfg.diff]}\n${m}\n${n}/10 · ${S.score}점`;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$("#note").textContent="복사했어요.",()=>$("#note").textContent="복사하지 못했어요.")}
addEventListener("keydown",e=>{if(!S||!S.q||e.metaKey||e.ctrlKey)return;if(S.done){if(e.key=="Enter")advance();return}
  if(cfg.type=="choice4"&&"1234".includes(e.key)&&e.key.length==1)pick(+e.key-1);else if(cfg.type=="choice4"&&e.key=="Enter"&&S.sel!=null)answer(S.sel);
  else if(cfg.type=="ox"&&/^[ox]$/i.test(e.key))answer(e.key.toUpperCase())});
let lastW=innerWidth;addEventListener("resize",()=>{if(innerWidth!==lastW&&S&&S.q){lastW=innerWidth;render()}});
home();
</script>
