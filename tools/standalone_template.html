<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빈칸 차트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0b0f17;--bg2:#111827;--panel:#151c28;--panel2:#1d2635;--line:#273244;--ink:#eef2f7;--muted:#8a96a8;
  --up:#ff5a5f;--down:#4d8dff;--accent:#ffd34d;--accent-ink:#231a00;--good:#2fd07f;--bad:#ff8a3d;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f5f9;--bg2:#e9edf4;--panel:#ffffff;--panel2:#f1f4f8;--line:#e1e6ee;--ink:#151a22;--muted:#677386;
  --up:#e5383b;--down:#1f6feb;--good:#11995a;--bad:#e8590c;--shadow:0 8px 24px rgba(20,30,50,.08);
}}
:root[data-theme="dark"]{--bg:#0b0f17}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 500px at 50% -200px,var(--bg2),var(--bg));color:var(--ink);
  font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.up{color:var(--up)}.dn{color:var(--down)}

/* 홈 */
.hero{padding:28px 4px 18px}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:28px;font-weight:900;letter-spacing:-.5px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:18px}
.seg{display:grid;gap:6px;background:var(--panel2);padding:5px;border-radius:14px}
.seg button{padding:11px 6px;border-radius:10px;font-weight:700;color:var(--muted);transition:.15s}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.label{font-size:13px;font-weight:700;margin:18px 0 8px;color:var(--muted)}
.cta{width:100%;padding:17px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:800;
  box-shadow:0 8px 20px rgba(255,211,77,.25);transition:transform .1s}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.35;box-shadow:none}
.ghost{width:100%;padding:15px;border-radius:16px;background:var(--panel2);font-weight:700;margin-top:10px}

/* 플레이 */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:10px 0 12px;margin:-16px 0 0}
.dots{display:flex;gap:5px;margin-top:10px}.dots i{flex:1;height:5px;border-radius:9px;background:var(--panel2)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--accent)}
.timer{height:3px;border-radius:9px;background:var(--panel2);margin-top:8px;overflow:hidden}.timer i{display:block;height:100%;background:var(--muted);transition:width .1s linear}
.timer i.hurry{background:var(--bad)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.tags span{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--panel2);color:var(--muted);font-weight:600}
.main{padding:8px 6px 4px;overflow:hidden}
.q{font-size:17px;font-weight:800;margin:18px 2px 10px}.fitq{font-size:15px;margin:10px 2px 8px}
.fit .tags{margin:0 0 6px}.fit .top{padding-bottom:6px}.fit .bottom{padding-top:8px}.fit .grid{gap:8px}.fit .opt{padding:6px 4px 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;padding:8px 6px 6px;border-radius:18px;background:var(--panel);border:2px solid var(--line);transition:transform .12s,border-color .12s;text-align:left}
.opt:active{transform:scale(.98)}
.opt .n{position:absolute;left:10px;top:9px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);font-weight:800;font-size:13px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,211,77,.18)}.opt.sel .n{background:var(--accent);color:var(--accent-ink)}
.opt.real{border-color:var(--good)}.opt.real .n{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad)}.opt.wrong .n{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.badge{position:absolute;right:10px;top:9px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;color:#fff}
.src{font-size:11px;color:var(--muted);padding:2px 6px 2px;line-height:1.3}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{padding:22px 0;border-radius:20px;font-size:44px;font-weight:900;background:var(--panel);border:2px solid var(--line);transition:transform .1s}
.ox button:active{transform:scale(.97)}
.verdict{margin-top:12px;padding:16px;animation:pop .25s ease-out both}
.verdict h2{margin:0;font-size:24px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--panel2);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:17px;margin-top:2px}
.bottom{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(transparent,var(--bg) 35%);margin-top:6px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes shake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.shake{animation:shake .3s}
svg{display:block;width:100%;height:auto}

/* 공부 */
.study-entry{display:flex;align-items:center;gap:12px;width:100%;padding:16px;margin-top:12px}
.study-entry .ic{width:42px;height:42px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:9px 14px;border-radius:999px;background:var(--panel2);color:var(--muted);font-weight:700;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.lesson{padding:16px;margin-bottom:12px}.lesson h3{margin:0 0 4px;font-size:17px}.lesson p{margin:6px 0 0;line-height:1.6;font-size:14.5px;color:var(--muted)}
.lesson .fig{background:var(--panel2);border-radius:14px;padding:8px;margin-top:12px}
.lesson .tip{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,211,77,.1);font-size:13.5px;line-height:1.55}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.figs>div{background:var(--panel2);border-radius:14px;padding:8px 8px 10px;text-align:center;font-size:13px}
.figs b{display:block;margin-top:4px;font-size:14px}
.stat-big{font-size:30px;font-weight:900;letter-spacing:-1px}
/* 결과 */
.score{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1}
.list div.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>const Q=__DATA__;</script>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const L={easy:"쉬움",normal:"보통",hard:"어려움",KOSPI:"코스피",KOSDAQ:"코스닥",large:"대형주",mid:"중형주",small:"소형주",micro:"초소형주",day:"일봉",week:"주봉"};
const SRC={mirror:"실제 모양을 뒤집은 것",other_stock:"다른 종목의 구간",other_stock_volatility_mismatch:"변동성이 다른 종목",same_market_cap_tier:"비슷한 규모 종목의 구간",same_stock_other_period:"같은 종목의 다른 시기",same_sector:"같은 업종 종목의 구간"};
const LIM={choice4:{easy:30,normal:25,hard:25},ox:{easy:15,normal:12,hard:12}}, MUL={easy:1,normal:1.5,hard:2.5};
const ZOOM={main:14,thumb:3}; // 빈칸 양옆으로 보여 줄 봉 수 (확대)
let cfg=Object.assign({type:"choice4",diff:"easy",iv:"day"},JSON.parse(localStorage.getItem("cg_cfg")||"{}")), S=null, timer=null;
const seen=new Set(JSON.parse(localStorage.getItem("cg_seen")||"[]"));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const save=()=>{try{localStorage.setItem("cg_cfg",JSON.stringify(cfg));localStorage.setItem("cg_seen",JSON.stringify([...seen]))}catch(e){}};
const key=q=>q.r.code+q.r.gap_start;

/* 차트: 빈칸 주변만 확대해서 그린다 */
function chart(p,fill,o={}){
  const {L:l,G:g,R:r}=p.layout,N=l+g+r,c=p.candles,thumb=!!o.thumb,side=thumb?ZOOM.thumb:ZOOM.main;
  const i0=Math.max(l-side,0),i1=Math.min(l+g+side,N);
  const W=thumb?220:720,H=thumb?(o.th||150):(o.mh||(innerWidth<560?560:400)),pr=thumb?4:(innerWidth<560?78:50),vol=!thumb&&p.volume;
  const top=thumb?8:14,pb=vol?H*.78:H-8;
  const vis=[];for(let i=i0;i<i1;i++){if(i<l)vis.push([i,c[i]]);else if(i>=l+g)vis.push([i,c[i-g]])}
  let lo=1e9,hi=-1e9;for(const grp of [vis.map(v=>v[1]),fill,o.ghost,...(o.range||[])])if(grp)for(const k of grp){lo=Math.min(lo,k[2]);hi=Math.max(hi,k[1])}
  const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const st=(W-pr-4)/(i1-i0),cx=i=>4+st*(i-i0+.5),y=v=>pb-(v-lo)/(hi-lo)*(pb-top),bw=Math.max(st*.62,1.5);
  const gx0=cx(l)-st/2,gx1=cx(l+g-1)+st/2;
  const cd=(k,x,op=1,extra="")=>{const u=k[3]>=k[0],col=u?"var(--up)":"var(--down)",t=y(Math.max(k[0],k[3])),h=Math.max(y(Math.min(k[0],k[3]))-t,1.2);
    return `<g opacity="${op}"${extra}><line x1="${x}" x2="${x}" y1="${y(k[1])}" y2="${y(k[2])}" stroke="${col}" stroke-width="${thumb?1.4:1.8}" stroke-linecap="round"/><rect x="${x-bw/2}" y="${t}" width="${bw}" height="${h}" rx="${bw>6?1.5:0}" fill="${col}"/></g>`};
  let s=`<svg viewBox="0 0 ${W} ${H}" font-family="Pretendard Variable,Pretendard,sans-serif" role="img" aria-label="${thumb?"보기 차트":"가운데가 가려진 차트"}">
  <defs><pattern id="h${o.id||0}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="var(--panel2)"/><line x1="0" y1="0" x2="0" y2="10" stroke="var(--line)" stroke-width="4"/></pattern></defs>`;
  if(!thumb){const span=(hi-lo)*100,step=[1,2,5,10,20,25,50,100].find(v=>span/v<=5)||200;
    for(let pc=Math.ceil((lo-1)*100/step)*step;pc<=(hi-1)*100;pc+=step){const v=1+pc/100;
      s+=`<line x1="0" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${pc==0?'stroke-dasharray="5 5"':'opacity=".55"'}/><text x="${W-pr+6}" y="${y(v)+4}" font-size="${innerWidth<560?20:12}" font-weight="600" fill="var(--muted)">${pc>0?"+":""}${pc}%</text>`}}
  if(fill){const col=o.style=="real"?"var(--good)":"var(--accent)";s+=`<rect x="${gx0}" y="0" width="${gx1-gx0}" height="${H}" fill="${col}" opacity="${thumb?0.06:0.09}" rx="8"/>`}
  else s+=`<rect x="${gx0}" y="2" width="${gx1-gx0}" height="${H-4}" fill="url(#h${o.id||0})" rx="10"/><circle cx="${(gx0+gx1)/2}" cy="${pb/2+top/2}" r="${thumb?14:28}" fill="var(--panel)"/><text x="${(gx0+gx1)/2}" y="${pb/2+top/2+(thumb?6:12)}" text-anchor="middle" font-size="${thumb?17:34}" font-weight="900" fill="var(--muted)">?</text>`;
  if(!thumb)s+=`<line x1="${gx0}" x2="${gx0}" y1="0" y2="${H}" stroke="var(--muted)" stroke-dasharray="3 4" opacity=".5"/><line x1="${gx1}" x2="${gx1}" y1="0" y2="${H}" stroke="var(--muted)" stroke-dasharray="3 4" opacity=".5"/>`;
  for(const [i,k] of vis)s+=cd(k,cx(i),thumb?.35:1);
  if(o.ghost)o.ghost.forEach((k,j)=>s+=cd(k,cx(l+j),.25));
  if(fill)fill.forEach((k,j)=>s+=cd(k,cx(l+j),1,o.style=="real"?` style="animation:fi .22s ${(j/g*.6).toFixed(2)}s both"`:""));
  if(vol){const fv=fill?o.fillVol:null,vals=[...vis.map(([i])=>p.volume[i<l?i:i-g]),...(fv||[])],vm=Math.max(...vals)||1,vy=v=>H-2-v/vm*(H-2-H*.82);
    for(const [i,k] of vis){const v=p.volume[i<l?i:i-g];s+=`<rect x="${cx(i)-bw/2}" y="${vy(v)}" width="${bw}" height="${H-2-vy(v)}" rx="1" fill="${k[3]>=k[0]?"var(--up)":"var(--down)"}" opacity=".35"/>`}
    if(fv)fv.forEach((v,j)=>{const k=fill[j];s+=`<rect x="${cx(l+j)-bw/2}" y="${vy(v)}" width="${bw}" height="${H-2-vy(v)}" rx="1" fill="${k[3]>=k[0]?"var(--up)":"var(--down)"}" opacity=".35"/>`})}
  return s+"</svg>";
}

function home(){
  S=null;clearInterval(timer);
  const pool=Q.filter(q=>q.iv==cfg.iv&&q.d==cfg.diff),left=pool.filter(q=>!seen.has(key(q))).length;
  const seg=(k,opts)=>`<div class="seg" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(([v,t])=>`<button class="${cfg[k]==v?"on":""}" onclick="cfg.${k}='${v}';save();home()">${t}</button>`).join("")}</div>`;
  app.innerHTML=`<div class="hero"><div class="logo"><i>?</i>빈칸 차트</div>
  <p class="muted" style="margin:10px 2px 0;line-height:1.5">실제 주식 차트의 가려진 구간,<br>진짜로 이어진 모양을 맞혀 보세요.</p></div>
  <div class="card" style="padding:18px 16px 20px">
    <div class="label" style="margin-top:0">문제 방식</div>${seg("type",[["choice4","4지선다"],["ox","O / X"]])}
    <div class="label">난이도</div>${seg("diff",[["easy","쉬움"],["normal","보통"],["hard","어려움"]])}
    <div class="label">차트 단위</div>${seg("iv",[["day","일봉"],["week","주봉"]])}
    <div class="row xs muted" style="margin-top:16px"><span>이 조건 남은 문제</span><span class="sp"></span><b class="tnum" style="color:var(--ink)">${left}</b>&nbsp;/ ${pool.length}</div>
  </div>
  <div style="margin-top:16px"><button class="cta" onclick="start()">10문제 시작</button></div>
  <button class="card study-entry" onclick="study()"><span class="ic">📘</span><span class="sp" style="text-align:left"><b>차트 공부하기</b><br><span class="xs muted">캔들 읽는 법 · 추세와 흐름 · 실제 데이터로 본 경향성</span></span><span class="muted">›</span></button>
  <p class="xs muted" style="text-align:center;margin-top:22px;line-height:1.7">테스트판 · 실제 문제 ${Q.length}개 수록<br>과거 데이터 기반 오락용이며 투자 권유가 아닙니다 · 가격 출처: 네이버 금융<br>
  <button class="xs muted" style="text-decoration:underline" onclick="seen.clear();save();home()">푼 문제 기록 지우기</button></p>`;
}

function start(){
  const pool=Q.filter(q=>q.iv==cfg.iv&&q.d==cfg.diff);let fresh=pool.filter(q=>!seen.has(key(q)));if(fresh.length<10)fresh=pool;
  const list=[],used=new Set();for(const q of shuffle(fresh)){if(used.has(q.r.code))continue;used.add(q.r.code);list.push(q);if(list.length==10)break}
  S={list,i:0,score:0,streak:0,res:[]};next();
}

function next(){
  const q=S.list[S.i];Object.assign(S,{q,order:shuffle([0,1,2,3]),ox:Math.random()<.5?0:1+(Math.random()*3|0),sel:null,done:false,t0:performance.now(),lim:LIM[cfg.type][q.d]*1000});
  render();window.scrollTo(0,0);clearInterval(timer);
  timer=setInterval(()=>{const left=S.lim-(performance.now()-S.t0),b=$("#tb");if(b){b.style.width=Math.max(left/S.lim*100,0)+"%";b.classList.toggle("hurry",left<5000)}if(left<=0)answer(null)},100);
}

function render(){
  const q=S.q,p=q.p,o=p.options,ox=cfg.type=="ox",ov=p.option_volume;
  let fill=null,fillVol=null,ghost=null,style=null;
  if(S.done){style="real";fill=o[0];fillVol=ov&&ov[0];
    if(ox&&S.ox!==0)ghost=o[S.ox];if(!ox&&S.ans!=null&&S.order[S.ans]!==0)ghost=o[S.order[S.ans]]}
  else if(ox){fill=o[S.ox];fillVol=ov&&ov[S.ox]}
  else if(S.sel!=null){fill=o[S.order[S.sel]];fillVol=ov&&ov[S.order[S.sel]]}
  const range=ox?[o[0],o[S.ox]]:o;
  const fit=!ox&&!S.done, cw=Math.min(innerWidth,720)-44, vh=innerHeight;
  const mh=fit?Math.max(200,Math.round(vh*.30*720/cw)):undefined, tw=(cw-10)/2-12, th=fit?Math.max(80,Math.round(vh*.135*220/tw)):undefined;
  const dots=Array.from({length:10},(_,i)=>`<i class="${i<S.res.length?(S.res[i].ok?"ok":"no"):i==S.i?"cur":""}"></i>`).join("");
  let h=`<div class="top"><div class="row"><button aria-label="그만하기" class="muted" style="font-size:22px;padding:4px 6px 4px 0" onclick="home()">✕</button>
    <b class="tnum">${S.i+1}<span class="muted"> / 10</span></b><span class="sp"></span>${S.streak>=2?`<b style="color:var(--accent)">🔥 ${S.streak}</b>`:""}<b class="tnum">${S.score.toLocaleString()}점</b></div>
    <div class="dots">${dots}</div>${S.done?"":`<div class="timer"><i id="tb" style="width:100%"></i></div>`}</div>
  <div class="tags"><span>${L[q.m]}</span><span>${L[q.t]}</span><span>${L[q.iv]}</span><span>${L[q.d]}</span></div>
  <div class="card main">${chart(p,fill,{ghost,range,style,fillVol,id:9,mh})}</div>`;

  if(S.done){const r=q.r,ok=S.ok,pc=v=>`<b class="${v>0?"up":v<0?"dn":""}">${v>0?"+":""}${v.toFixed(1)}%</b>`;
    const sub=ox?(S.ox===0?"보여 드린 모양이 실제였어요.":"보여 드린 모양은 가짜였어요. 흐린 것이 가짜, 선명한 것이 실제예요."):(!ok&&S.ans!=null?"흐리게 겹친 것이 내가 고른 모양이에요.":"");
    h+=`<div class="card verdict ${ok?"":"shake"}" style="border:2px solid ${ok?"var(--good)":"var(--bad)"}">
      <div class="row"><h2 style="color:${ok?"var(--good)":"var(--bad)"}">${ok?"정답!":S.ans==null?"시간 초과":"아쉬워요"}</h2><span class="sp"></span><b class="tnum" style="font-size:18px">+${S.pts}</b></div>
      ${sub?`<p class="sm muted" style="margin:6px 0 0">${sub}</p>`:""}
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><b style="font-size:19px">${r.name}</b> <span class="sm muted">${r.code}</span>
      <div class="sm muted" style="margin-top:2px">당시 ${L[r.cap_tier_then]} · ${r.gap_start} ~ ${r.gap_end}</div></div>

      ${r.delisted?`<p class="xs muted" style="margin:10px 0 0">이 종목은 ${r.delisted.date}에 상장폐지됐어요 (${r.delisted.reason}).</p>`:""}</div>`}

  if(!ox){
    h+=`<div class="q${fit?" fitq":""}">${S.done?"보기":"빈칸에 실제로 들어간 모양은?"}</div><div class="grid">`+S.order.map((k,i)=>{

      const badge=S.done&&k===0?`<span class="badge" style="background:var(--good)">실제</span>`:S.done&&S.ans===i?`<span class="badge" style="background:var(--bad)">내 선택</span>`:"";
      return `<button class="opt ${cls}" ${S.done?"disabled":`onclick="pick(${i})"`} aria-label="보기 ${i+1}"><span class="n">${i+1}</span>${badge}${chart(p,o[k],{thumb:true,range:o,id:i,th})}${S.done&&k!==0?`<div class="src">${SRC[q.r.decoy_sources[k-1]]||""}</div>`:""}</button>`}).join("")+`</div>`;
    if(!S.done)h+=`<div class="bottom"><button class="cta" ${S.sel==null?"disabled":""} onclick="answer(S.sel)">${S.sel==null?"보기를 골라 주세요":(S.sel+1)+"번으로 확정"}</button></div>`;
  } else if(!S.done){
    h+=`<div class="q" style="text-align:center">빈칸에 들어간 이 모양, 실제일까요?</div><div class="ox">
      <button style="color:var(--good);border-color:var(--good)" onclick="answer('O')" aria-label="O, 실제다">O</button>
      <button style="color:var(--bad);border-color:var(--bad)" onclick="answer('X')" aria-label="X, 가짜다">X</button></div>`;
  }
  if(S.done)h+=`<div style="margin-top:16px"><button class="cta" onclick="advance()">${S.i==9?"결과 보기":"다음 문제"}</button></div>`;

}
function pick(i){if(S.sel===i)answer(i);else{S.sel=i;render()}}
function advance(){S.i++;S.i<10?next():result()}
function answer(c){
  if(!S||S.done)return;clearInterval(timer);const el=performance.now()-S.t0,q=S.q;
  const ok=c!=null&&el<=S.lim+300&&(cfg.type=="ox"?(c=="O")==(S.ox===0):S.order[c]===0);
  const base=100*MUL[q.d],pts=ok?Math.round((base+base*.5*Math.max(0,1-el/S.lim))*Math.min(1+.1*S.streak,2)*(cfg.type=="ox"?.5:1)):0;
  Object.assign(S,{done:true,ans:c,ok,pts,score:S.score+pts,streak:ok?S.streak+1:0});S.res.push({ok,q,pts});
  seen.add(key(q));save();render();window.scrollTo({top:0,behavior:"smooth"});

// 그림용 캔들: [시가, 고가, 저가, 종가]
function mini(cs,{w=280,h=120,mark=null,lines=[],label=null}={}){
  let lo=1e9,hi=-1e9;cs.forEach(k=>{lo=Math.min(lo,k[2]);hi=Math.max(hi,k[1])});lines.forEach(l=>{lo=Math.min(lo,l.v);hi=Math.max(hi,l.v)});
  const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;const n=cs.length,st=w/n,bw=Math.min(st*.6,26),y=v=>h-6-(v-lo)/(hi-lo)*(h-12);
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  if(mark)s+=`<rect x="${mark[0]*st}" y="0" width="${(mark[1]-mark[0])*st}" height="${h}" rx="8" fill="var(--accent)" opacity=".13"/>`;
  lines.forEach(l=>s+=`<line x1="0" x2="${w}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.c||"var(--muted)"}" stroke-dasharray="5 4" stroke-width="1.5"/>${l.t?`<text x="${w-4}" y="${y(l.v)-5}" text-anchor="end" font-size="11" font-weight="700" fill="${l.c||"var(--muted)"}">${l.t}</text>`:""}`);
  cs.forEach((k,i)=>{const x=st*(i+.5),u=k[3]>=k[0],col=u?"var(--up)":"var(--down)",t=y(Math.max(k[0],k[3])),hh=Math.max(y(Math.min(k[0],k[3]))-t,2);
    s+=`<line x1="${x}" x2="${x}" y1="${y(k[1])}" y2="${y(k[2])}" stroke="${col}" stroke-width="2" stroke-linecap="round"/><rect x="${x-bw/2}" y="${t}" width="${bw}" height="${hh}" rx="2" fill="${col}"/>`});
  return s+"</svg>";
}
// 종가 흐름으로 캔들 만들기 (그림용)
function path(closes,noise=.25){const out=[];let prev=closes[0];for(let i=1;i<closes.length;i++){const c=closes[i],o=prev,amp=Math.abs(c-o)*noise+.6;out.push([o,Math.max(o,c)+amp*((i*7)%5)/5+.3,Math.min(o,c)-amp*((i*3)%5)/5-.3,c]);prev=c}return out}
